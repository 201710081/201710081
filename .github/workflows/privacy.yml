name: Public career privacy check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/privacy_guard.py --snapshot HEAD
      - name: Check every proposed commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [ -n "$BASE" ] && ! [[ "$BASE" =~ ^0+$ ]]; then
            python scripts/privacy_guard.py --range "$BASE" "$TIP"
          fi
